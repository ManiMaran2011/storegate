{{- /*
All credentials are generated once and then kept: on upgrade the existing Secret value is read back with
`lookup`, so a `helm upgrade` never rotates a database password out from under a running volume.
Nothing secret is stored in values files. (`helm template` has no cluster to look up, so it shows fresh values.)
*/ -}}
{{- $s := .Values.namespaces.store -}}
{{- $p := .Values.namespaces.platform -}}
{{- $wooToken := include "storegate.secretValue" (dict "root" . "id" "wooToken" "ns" $s "secret" "woo-mcp-auth" "key" "token" "len" 48) -}}
{{- $mariaRoot := include "storegate.secretValue" (dict "root" . "id" "mariaRoot" "ns" $s "secret" "mariadb-credentials" "key" "root-password" "len" 32) -}}
{{- $mariaUser := include "storegate.secretValue" (dict "root" . "id" "mariaUser" "ns" $s "secret" "mariadb-credentials" "key" "password" "len" 32) -}}
{{- $wpAdmin := include "storegate.secretValue" (dict "root" . "id" "wpAdmin" "ns" $s "secret" "wordpress-admin" "key" "password" "len" 24 "override" .Values.store.wordpress.adminPassword) -}}
{{- $wooCk := include "storegate.secretValue" (dict "root" . "id" "wooCk" "ns" $s "secret" "woo-api" "key" "consumer-key" "len" 40) -}}
{{- $wooCs := include "storegate.secretValue" (dict "root" . "id" "wooCs" "ns" $s "secret" "woo-api" "key" "consumer-secret" "len" 40) -}}
{{- /* The stored Secret already carries the ck_/cs_ prefix; strip it so re-renders never stack prefixes (the DB column is 43 chars). */ -}}
{{- $wooCk = regexReplaceAll "^(ck_)+" $wooCk "" -}}
{{- $wooCs = regexReplaceAll "^(cs_)+" $wooCs "" -}}
{{- $pgPass := include "storegate.secretValue" (dict "root" . "id" "pgPass" "ns" $p "secret" "postgres-credentials" "key" "password" "len" 32) -}}
{{- $encKey := include "storegate.secretValue" (dict "root" . "id" "encKey" "ns" $p "secret" "gateway-secrets" "key" "ENCRYPTION_KEY_RAW" "len" 32) -}}
{{- $adminPw := include "storegate.secretValue" (dict "root" . "id" "adminPw" "ns" $p "secret" "gateway-secrets" "key" "BOOTSTRAP_ADMIN_PASSWORD" "len" 20 "override" .Values.platform.gateway.bootstrapAdmin.password) -}}
{{- $fxTok := include "storegate.secretValue" (dict "root" . "id" "fxTok" "ns" $p "secret" "upstream-tokens" "key" "FX_MCP_TOKEN" "len" 48) -}}
{{- $tkTok := include "storegate.secretValue" (dict "root" . "id" "tkTok" "ns" $p "secret" "upstream-tokens" "key" "TICKETS_MCP_TOKEN" "len" 48) -}}
{{- $evTok := include "storegate.secretValue" (dict "root" . "id" "evTok" "ns" $p "secret" "upstream-tokens" "key" "EVIL_MCP_TOKEN" "len" 48) -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-credentials
  namespace: {{ $s }}
  {{- include "storegate.secretMeta" . }}
type: Opaque
stringData:
  root-password: {{ $mariaRoot | quote }}
  password: {{ $mariaUser | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-admin
  namespace: {{ $s }}
  {{- include "storegate.secretMeta" . }}
type: Opaque
stringData:
  password: {{ $wpAdmin | quote }}
---
# WooCommerce REST credentials. The setup Job installs exactly this pair for a dedicated
# low-privilege WordPress user; woo-mcp uses it. Nobody else ever sees it.
apiVersion: v1
kind: Secret
metadata:
  name: woo-api
  namespace: {{ $s }}
  {{- include "storegate.secretMeta" . }}
type: Opaque
stringData:
  consumer-key: {{ printf "ck_%s" $wooCk | quote }}
  consumer-secret: {{ printf "cs_%s" $wooCs | quote }}
---
# Bearer token the gateway must present to woo-mcp. Present in both namespaces with the same value.
apiVersion: v1
kind: Secret
metadata:
  name: woo-mcp-auth
  namespace: {{ $s }}
  {{- include "storegate.secretMeta" . }}
type: Opaque
stringData:
  token: {{ $wooToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: {{ $p }}
  {{- include "storegate.secretMeta" . }}
type: Opaque
stringData:
  password: {{ $pgPass | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: {{ $p }}
  {{- include "storegate.secretMeta" . }}
type: Opaque
stringData:
  # 32 random characters -> 32 bytes; stored as the raw value and base64-encoded for the app.
  ENCRYPTION_KEY_RAW: {{ $encKey | quote }}
  ENCRYPTION_KEY: {{ $encKey | b64enc | quote }}
  BOOTSTRAP_ADMIN_PASSWORD: {{ $adminPw | quote }}
  LLM_API_KEY: {{ .Values.platform.gateway.llm.apiKey | quote }}
---
# Bearer tokens for each upstream. Mounted into the gateway (to authenticate to them) and into
# the matching server (to require them). They never reach a browser or an MCP client.
apiVersion: v1
kind: Secret
metadata:
  name: upstream-tokens
  namespace: {{ $p }}
  {{- include "storegate.secretMeta" . }}
type: Opaque
stringData:
  WOO_MCP_TOKEN: {{ $wooToken | quote }}
  FX_MCP_TOKEN: {{ $fxTok | quote }}
  TICKETS_MCP_TOKEN: {{ $tkTok | quote }}
  EVIL_MCP_TOKEN: {{ $evTok | quote }}
